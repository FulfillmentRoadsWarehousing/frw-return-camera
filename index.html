
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>FRW Return Photos</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 30px auto;
      padding: 20px;
      text-align: center;
    }
    video {
      width: 100%;
      max-height: 450px;
      background: #222;
      border-radius: 10px;
    }
    button {
      padding: 14px 24px;
      margin: 10px;
      cursor: pointer;
      font-size: 16px;
    }
    img {
      max-width: 45%;
      margin: 5px;
      border-radius: 8px;
    }
    #status {
      color: #555;
    }
  </style>
</head>
<body>
  <h2>FRW Return Photo Capture</h2>
  <p id="status">Camera not started</p>

  <video id="video" autoplay playsinline muted></video>

  <div>
    <button onclick="startCamera()">Start Camera</button>
    <button onclick="takePhoto()">Capture Photo</button>
  </div>

  <h3>Captured Photos</h3>
  <div id="photos"></div>

  <script>
    let stream;
    let photoCount = 0;

    async function startCamera() {
      try {
        if (stream) {
          stream.getTracks().forEach(track => track.stop());
        }

        stream = await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: false
        });

        const video = document.getElementById('video');
        video.srcObject = stream;
        await video.play();

        document.getElementById('status').textContent =
          'Camera connected successfully';
      } catch (error) {
        document.getElementById('status').textContent =
          'Camera error: ' + error.message;
      }
    }

    function takePhoto() {
      const video = document.getElementById('video');

      if (!video.videoWidth) {
        alert('Please start the camera first.');
        return;
      }

      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      const context = canvas.getContext('2d');
      context.drawImage(video, 0, 0);

      const image = document.createElement('img');
      image.src = canvas.toDataURL('image/jpeg', 0.9);

      document.getElementById('photos').appendChild(image);

      photoCount++;
      document.getElementById('status').textContent =
        photoCount + ' photo(s) captured';
    }
  </script>

<!-- FRW Google Sign-In Test -->
<hr>
<h3>FRW Account Connection</h3>
<p id="googleStatus">Not signed in</p>
<div id="googleSignIn"></div>

<script src="https://accounts.google.com/gsi/client"></script>
<script>
  const GOOGLE_CLIENT_ID =
    '758478931940-1dbs3udk5t7oeq9lgvubq9255t76kfon.apps.googleusercontent.com';

  function handleGoogleSignIn(response) {
    try {
      // Decode the token for display only.
      // Actual backend authorization will verify it.
      const payload = response.credential.split('.')[1];
      const decoded = JSON.parse(
        atob(
          payload.replace(/-/g, '+')
            .replace(/_/g, '/')
        )
      );

      document.getElementById('googleStatus')
        .textContent =
          'Signed in as: ' + decoded.email;

    } catch (error) {
      document.getElementById('googleStatus')
        .textContent =
          'Sign-in response could not be read.';
    }
  }

  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: handleGoogleSignIn
  });

  google.accounts.id.renderButton(
    document.getElementById('googleSignIn'),
    {
      theme: 'outline',
      size: 'large',
      text: 'signin_with'
    }
  );
</script>

<!-- FRW Return Queue Connection Test -->
<hr>
<h3>Pending Rejected Returns</h3>
<p id="queueStatus">Not connected</p>

<button onclick="authorizeAndLoadReturns()">
  Authorize FRW Returns
</button>

<pre id="queueResults"></pre>

<script>
  const FRW_DEPLOYMENT_ID =
    'AKfycbzzw1IQX8k5PHQj5d_BU2O4RF_Myy-Rxs8ZokOmMwJXAqnhJYM77C9csjgVRL6Ejpd4';

  const FRW_SCOPES = [
    'https://www.googleapis.com/auth/drive',
    'https://www.googleapis.com/auth/spreadsheets'
  ].join(' ');

  let frwTokenClient;

  function authorizeAndLoadReturns() {
    const status = document.getElementById('queueStatus');

    if (!window.google?.accounts?.oauth2) {
      status.textContent = 'Google authorization library unavailable.';
      return;
    }

    frwTokenClient = google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: FRW_SCOPES,

      callback: async (response) => {
        if (response.error || !response.access_token) {
          status.textContent =
            'Authorization failed: ' +
            (response.error || 'No access token');
          return;
        }

        status.textContent = 'Authorized. Loading returns...';

        await loadPendingReturns(response.access_token);
      }
    });

    frwTokenClient.requestAccessToken({
      prompt: 'consent'
    });
  }

  async function loadPendingReturns(accessToken) {
    const status = document.getElementById('queueStatus');

    const url =
      'https://script.googleapis.com/v1/scripts/' +
      encodeURIComponent(FRW_DEPLOYMENT_ID) +
      ':run';

    try {
      const response = await fetch(url, {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + accessToken,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          function: 'getPendingRejects',
          parameters: []
        })
      });

      const data = await response.json();

      if (!response.ok || data.error || data.error?.details) {
        status.textContent = 'API request failed';
        document.getElementById('queueResults')
          .textContent = JSON.stringify(data, null, 2);
        return;
      }

      const result = data.response?.result || [];

      status.textContent =
        'Connected! Pending returns: ' + result.length;

      document.getElementById('queueResults')
        .textContent = JSON.stringify(result, null, 2);

    } catch (error) {
      status.textContent = 'Connection failed: ' + error.message;
    }
  }
</script>

</body>
</html>
